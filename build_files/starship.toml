format = """
[  Inhumano@Bazzite](bg:#d3daf2 fg:#090c0c bold)\
[](bg:#497de3 fg:#d3daf2)\
$directory\
[](fg:#497de3 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
$python\
$c\
[](fg:#212736 bg:#1d2230)\
$time\
[](fg:#1d2230 bg:#090c0c)\
$cmd_duration\
[ ](fg:#090c0c)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#497de3 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "   "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#497de3 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#497de3 bg:#394260)]($style)'

[nodejs]
symbol = "  "
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#497de3 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#497de3 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#497de3 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#497de3 bg:#212736)]($style)'

[python]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#497de3 bg:#212736)]($style)'

[c]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#497de3 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[cmd_duration]
show_milliseconds = false
min_time = 0
format = '[[ ⏱️ $duration ](fg:#a0a9cb bg:#090c0c)]($style)'
style = "bg:#090c0c"
disabled = false
show_notifications = false
